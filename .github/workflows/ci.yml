name: Test and build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-tested.txt
      - name: Install dependencies
        run: python -m pip install -c requirements-tested.txt -e ".[dev,windows]"
      - name: Install Chinese fonts for the Linux screenshot
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Tests without real accounts or hardware
        run: python -m pytest -q
      - name: Start the source app and verify its offline demo
        run: python scripts/build_smoke.py --source --screenshot build/ci-demo.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.os }}
          path: build/ci-demo.*
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-tested.txt
      - name: Install build and runtime dependencies
        run: python -m pip install -c requirements-tested.txt -e ".[dev,windows,local-asr]"
      - name: Build Windows onedir
        run: python scripts/build_windows.py
      - name: Check packaged dependencies and start the real EXE offline
        run: >-
          python scripts/build_smoke.py
          --executable dist/KotonohaVR/KotonohaVR.exe
          --screenshot dist/KotonohaVR/ci-demo.png
      - name: Upload the Windows app after its launch check passes
        uses: actions/upload-artifact@v4
        with:
          name: KotonohaVR-windows-x64
          path: dist/KotonohaVR/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics if packaging or launch fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            build/pyinstaller/KotonohaVR/warn-KotonohaVR.txt
            dist/KotonohaVR/ci-demo.*
          if-no-files-found: warn
          retention-days: 14
